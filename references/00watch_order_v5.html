<script>
const topics = [
  { tag: '效率 / 心流', detail: '任务设计 / 启动', title: '拖延往往不是懒，而是任务起点设计得太模糊' },
  { tag: '心理学', detail: '吸引力 / 信任', title: '为什么适度暴露脆弱感，反而更容易建立信任' },
  { tag: '学习方法', detail: '输入 / 复盘', title: '高密度内容看完以后，怎样复盘才不会白看' },
  { tag: '商业分析', detail: '案例 / 竞争', title: '同样一个案例，高手先看的往往不是结论' },
  { tag: '表达沟通', detail: '叙事 / 说服', title: '把复杂观点讲清楚，核心不是多讲而是先减法' },
  { tag: '产品策略', detail: '增长 / 取舍', title: '做产品时，为什么删功能常常比加功能更有效' },
  { tag: '职业成长', detail: '执行 / 管理', title: '从能做事到会带人，中间差的不是经验而是视角' },
  { tag: '身心状态', detail: '节奏 / 恢复', title: '高压周期里保住稳定输出，比偶尔爆发更值钱' },
  { tag: '创作方法', detail: '选题 / 结构', title: '一个选题能不能打动人，先看冲突是否足够清楚' },

  { tag: '财富思维', detail: '消费 / 投资', title: '真正拉开差距的不是收入，而是资源配置方式' },
  { tag: '组织管理', detail: '协作 / 反馈', title: '团队沟通低效，往往不是态度问题而是上下文缺失' },
  { tag: '认知升级', detail: '偏差 / 校准', title: '很多误判不是信息少，而是先入为主太重' },
  { tag: '个人品牌', detail: '定位 / 传播', title: '你被记住，不靠标签多，而靠一个点打透' },
  { tag: '创业观察', detail: '模式 / 现金流', title: '商业模式看起来漂亮，不代表现金流真的健康' },
  { tag: '教育成长', detail: '习惯 / 激励', title: '孩子不愿意学，很多时候是反馈机制设计错了' },
  { tag: '亲密关系', detail: '边界 / 期待', title: '关系里最伤人的，常常不是冲突而是误读' },
  { tag: '求职面试', detail: '简历 / 表达', title: '面试里真正拉开差距的是案例细节，不是口号' },
  { tag: '写作表达', detail: '结构 / 节奏', title: '好文章不是信息堆得多，而是每一段都在往前推' },
  { tag: '内容策划', detail: '用户 / 留存', title: '让人看完还想继续，靠的是节奏设计不是花活' }
];

const focusPool = [
  '重点：先把任务拆到能立刻开工的第一步，再给结果设一个清晰完成标准。',
  '重点：真正让人产生好感的不是完美，而是可信、稳定、愿意承担。',
  '重点：输入后如果没有复述、归类、迁移，信息再多也很难真正留下来。',
  '重点：看案例先抓变量、约束和动作，不要被包装好的结论牵着走。',
  '重点：先说结论，再补理由，最后给例子，听众的理解成本会明显下降。',
  '重点：真正有效的取舍，不是简单删东西，而是明确什么问题不解决。',
  '重点：管理的关键不是亲自做得更快，而是让别人更稳定地做对。',
  '重点：输出能力的上限，很多时候取决于你是否会安排恢复和切换。',
  '重点：选题先找具体冲突，再决定角度，内容才更容易形成记忆点。',
  '重点：不确定环境里，比起追求最优，更重要的是先排除高代价错误。',
  '重点：资源一旦开始按优先级流动，增长速度就会和单纯勤奋拉开差距。',
  '重点：团队误解反复出现时，优先补齐背景、目标和判断依据三个层面。',
  '重点：先判断自己是看错了、看少了，还是过早下结论，能明显减少误判。',
  '重点：一个稳定的人设，往往来自重复输出同一类价值，而不是频繁换方向。',
  '重点：商业是否可持续，最终要回到获客成本、复购和回款节奏这三个问题。',
  '重点：好习惯的关键不是讲道理，而是让开始更容易、反馈更及时。',
  '重点：很多关系问题不是谁对谁错，而是双方默认前提从来没对齐过。',
  '重点：好案例回答不是讲经历流水账，而是把问题、动作和结果压成一条线。',
  '重点：每一段都承担明确功能，文章才会有推进感，不会读到一半散掉。',
  '重点：内容留存高，不一定因为信息更猛，而是每一分钟都给了继续看的理由。'
];

const categoryConfig = {
  all: {
    label: '全部',
    accent: '#ffffff',
    soft: '#dbe2f0',
    deep: '#b9c4da',
    bg: 'rgba(255,255,255,.045)',
    border: 'rgba(255,255,255,.14)'
  },
  strong: {
    label: '强烈推荐',
    accent: '#b8de7f',
    soft: '#d7ecb1',
    deep: '#8bb85a',
    bg: 'rgba(184,222,127,.09)',
    border: 'rgba(184,222,127,.22)'
  },
  medium: {
    label: '中等片段可取',
    accent: '#ab96e5',
    soft: '#d4caf3',
    deep: '#8873c8',
    bg: 'rgba(171,150,229,.09)',
    border: 'rgba(171,150,229,.22)'
  },
  low: {
    label: '少量片段可取',
    accent: '#f6c90e',
    soft: '#ffe891',
    deep: '#c49a05',
    bg: 'rgba(246,201,14,.08)',
    border: 'rgba(246,201,14,.22)'
  },
  skip: {
    label: '不值得看',
    accent: '#A24A42',
    soft: '#f7dad6',
    deep: '#c94d4d',
    bg: 'rgba(240,112,112,.12)',
    border: 'rgba(240,112,112,.28)'
  },
  failed: {
    label: '解析失败',
    accent: '#9ca3af',
    soft: '#d1d5db',
    deep: '#6b7280',
    bg: 'rgba(156,163,175,.09)',
    border: 'rgba(156,163,175,.24)'
  }
};

const filterOrder = ['all', 'strong', 'medium', 'low', 'skip', 'failed'];
let activeFilter = 'all';

function pad(num) {
  return String(num).padStart(2, '0');
}

function fmt(totalSeconds) {
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return `${pad(minutes)}:${pad(seconds)}`;
}

function qualityFor(score) {
  if (score >= 8.7) {
    return { key: 'strong', text: categoryConfig.strong.label };
  }
  if (score >= 7.5) {
    return { key: 'medium', text: categoryConfig.medium.label };
  }
  if (score >= 6.3) {
    return { key: 'low', text: categoryConfig.low.label };
  }
  return { key: 'skip', text: categoryConfig.skip.label };
}

function buildItem(index) {
  const topic = topics[index % topics.length];
  const score = Number((9.8 - index * 0.09).toFixed(1));
  const density = Math.max(38, 92 - index);
  const quality = qualityFor(score);
  const startA = 70 + (index * 73) % 900;
  const endA = startA + 82;
  const startB = 260 + (index * 91) % 900;
  const endB = startB + 64;
  const focus = focusPool[index % focusPool.length];

  return {
    type: 'rank',
    index,
    score,
    density,
    topic,
    quality,
    startA,
    endA,
    startB,
    endB,
    focus
  };
}

const items = Array.from({ length: 50 }, (_, index) => buildItem(index));

function countFor(filterKey) {
  if (filterKey === 'all') {
    return items.length;
  }
  return items.filter((item) => item.quality?.key === filterKey || item.type === filterKey).length;
}

function buildFilterChip(filterKey) {
  const config = categoryConfig[filterKey];
  const activeClass = filterKey === activeFilter ? 'active' : '';

  return `
    <button
      class="filter-chip ${activeClass}"
      type="button"
      data-filter="${filterKey}"
      style="--filter-accent:${config.accent}; --filter-accent-soft:${config.soft}; --filter-bg:${config.bg}; --filter-border:${config.border};"
    >
      <span class="filter-text">${config.label}</span>
    </button>
  `;
}

function buildRankCard(item) {
  const config = categoryConfig[item.quality.key];
  const summary = item.focus.replace(/^重点：/, '');

  return `
    <div
      class="rank-card"
      style="--group-accent:${config.accent}; --group-accent-soft:${config.soft}; --group-accent-deep:${config.deep}; --group-bg:${config.bg}; --group-border:${config.border};"
    >
      <div class="rank-card-top">
        <div class="rank-num">${pad(item.index + 1)}</div>
        <div class="rank-meta">
          <div class="rank-title"><a href="#">示例视频 ${pad(item.index + 1)} · ${item.topic.title}</a></div>
          <div class="rank-badges">
            <span class="badge badge-category" style="--badge-accent:${config.accent}; --badge-border:${config.border}; --badge-bg:${config.bg};">${item.quality.text}</span>
            <span class="badge badge-topic">${item.topic.tag}</span>
            <span class="badge badge-muted">${item.topic.detail}</span>
          </div>
        </div>
        <div class="rank-score-box">
          <div class="score-big">${item.score.toFixed(1)}</div>
          <span class="score-denom">/ 10</span>
        </div>
      </div>
      <!-- 进度条表示信息密度，不表示综合评分。 -->
      <div class="score-bar-wrap">
        <div class="score-bar-track">
          <div class="score-bar-fill" style="width:${item.density}%"></div>
        </div>
      </div>
      <div class="card-body">
        <div class="body-summary">${summary}</div>
        <div class="clips-row">
          <span class="clips-label">推荐观看片段</span>
          <span class="clip-pill">▶ ${fmt(item.startA)} – ${fmt(item.endA)}</span>
          <span class="clip-pill">▶ ${fmt(item.startB)} – ${fmt(item.endB)}</span>
        </div>
      </div>
    </div>
  `;
}

function buildEmptyState(filterKey) {
  const title = `${categoryConfig[filterKey].label}：当前没有内容`;
  const text = filterKey === 'failed'
    ? '这个示例页当前没有解析失败卡片，所以这一组先显示为空。'
    : '这一组当前没有匹配卡片，可以切回“全部”继续看。';

  return `
    <div class="empty-title">${title}</div>
    <div class="empty-text">${text}</div>
  `;
}

function renderStats() {
  const total = items.length;
  const failed = items.filter((item) => item.type === 'failed').length;
  const success = total - failed;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-success').textContent = success;
  document.getElementById('stat-failed').textContent = failed;
}

function renderFilterBanner() {
  const chips = filterOrder.map(buildFilterChip);
  const content = chips.length > 1
    ? `${chips[0]}<div class="filter-sep"></div>${chips.slice(1).join('')}`
    : chips.join('');

  document.getElementById('filter-banner').innerHTML = `
    ${content}
  `;
}

function renderList() {
  const filtered = activeFilter === 'all'
    ? items
    : items.filter((item) => item.quality?.key === activeFilter || item.type === activeFilter);

  document.getElementById('rank-list').innerHTML = filtered.map((item) => buildRankCard(item)).join('');

  const emptyState = document.getElementById('empty-state');
  if (filtered.length === 0) {
    const config = categoryConfig[activeFilter];
    emptyState.hidden = false;
    emptyState.style.setProperty('--empty-accent', config.accent);
    emptyState.style.setProperty('--empty-bg', config.bg);
    emptyState.style.setProperty('--empty-border', config.border);
    emptyState.innerHTML = buildEmptyState(activeFilter);
  } else {
    emptyState.hidden = true;
    emptyState.removeAttribute('style');
    emptyState.innerHTML = '';
  }
}

document.getElementById('filter-banner').addEventListener('click', (event) => {
  const chip = event.target.closest('[data-filter]');
  if (!chip) {
    return;
  }
  activeFilter = chip.dataset.filter;
  renderFilterBanner();
  renderList();
});

renderStats();
renderFilterBanner();
renderList();
</script>
</body>
</html>
